<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#070f1a" />
    <meta name="description" content="نجاة في الصقيع — استراتيجية بقاء HD في عالم متجمد" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>نجاة في الصقيع — Ember Colony</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070f1a;
        font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #1a2840 0%, #070f1a 70%);
        color: #f0e6d4;
        z-index: 100;
        transition: opacity 0.4s ease;
      }
      #boot-splash.hidden { opacity: 0; pointer-events: none; }
      #boot-splash h1 {
        font-size: clamp(1.8rem, 5vw, 2.8rem);
        margin: 0 0 0.5rem;
        letter-spacing: 0.04em;
        color: #f2e6d0;
        text-shadow: 0 0 28px rgba(196, 163, 90, 0.55);
      }
      #boot-splash p { opacity: 0.75; margin: 0; color: #c4a35a; }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <h1>نجاة في الصقيع</h1>
      <p>…جاري الإشعال…</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
